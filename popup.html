<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Qoder Test Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <img src="icons/icon48.png" alt="Logo" width="28" height="28">
      <h1>Qoder Test Helper</h1>
    </div>
    <p class="popup-desc">悬浮面板已集成到页面中，点击按钮即可唤起</p>
    <button class="popup-btn" id="toggle-panel-btn">
      <span class="btn-icon">🛠</span>
      <span id="btn-text">打开悬浮面板</span>
    </button>
    <div class="popup-footer">
      <span class="popup-tip">💡 面板可拖拽移动，不影响页面操作</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
